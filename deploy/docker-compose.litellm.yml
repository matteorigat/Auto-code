services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ../config/litellm.yaml:/app/config.yaml
      - ../dashboard:/app/dashboard
      - ../.hydra:/app/.hydra
    command:
      - "--config=/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    environment:
      - LITELLM_LOG=INFO
      - DATABASE_URL=postgresql://llmproxy:dbpassword9090@db:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:-sk-1234}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Map all API keys so the container has access
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - KILOCODE_API_KEY=${KILOCODE_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - DASHBOARD_HOST=host.docker.internal
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8081}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"


  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=llmproxy
      - POSTGRES_PASSWORD=dbpassword9090
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - litellm_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  litellm_data:
  redis_data:
