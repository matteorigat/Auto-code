<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Control Center</title>
    <meta name="description" content="Premium real-time command dashboard for OpenCode Bridge">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/custom.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#030712',
                        surface: '#111827',
                        primary: '#8b5cf6',
                        accentBlue: '#3b82f6',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#f43f5e',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen p-4 md:p-6 pb-12">
    <div id="app" class="max-w-7xl mx-auto space-y-6">
        <!-- Auth overlay target -->
        <div id="auth-overlay"></div>

        <!-- Header component -->
        <header id="header-container" class="glass-panel p-6"></header>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-white/5 px-2 gap-6 overflow-x-auto custom-scrollbar whitespace-nowrap">
            <button id="tab-btn-overview" class="nav-tab active text-zinc-400 text-sm font-semibold pb-3 outline-none">
                Overview & Controls
            </button>
            <button id="tab-btn-logs" class="nav-tab text-zinc-400 text-sm font-semibold pb-3 outline-none flex items-center gap-2">
                Live System Logs
                <span id="logs-count-badge" class="bg-zinc-800 text-[10px] text-zinc-400 px-1.5 py-0.5 rounded-full font-bold">0</span>
            </button>
            <button id="tab-btn-hitl" class="nav-tab text-zinc-400 text-sm font-semibold pb-3 outline-none flex items-center gap-2">
                HITL Gate Resolution
                <span id="hitl-alert-dot" class="w-2 h-2 rounded-full bg-warning hidden hitl-badge-glow"></span>
            </button>
            <button id="tab-btn-quotas" class="nav-tab text-zinc-400 text-sm font-semibold pb-3 outline-none">
                Provider Quotas & Audits
            </button>
            <button id="tab-btn-explorer" class="nav-tab text-zinc-400 text-sm font-semibold pb-3 outline-none">
                API Calls Explorer
            </button>
            <button id="tab-btn-models" class="nav-tab text-zinc-400 text-sm font-semibold pb-3 outline-none">
                Model Management
            </button>
        </div>

        <!-- Tab Content panels -->
        <main class="space-y-6">
            <!-- 1. OVERVIEW TAB -->
            <div id="tab-content-overview" class="tab-content active space-y-6">
                <!-- Main metric cards -->
                <div id="stats-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>

                <!-- First Row: Charts (Burn & Model Distribution) -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Burn Chart -->
                    <div id="burn-chart-container" class="glass-panel p-6 h-80 relative lg:col-span-2">
                        <h3 class="text-sm font-semibold text-zinc-400 uppercase tracking-wider mb-2">Token Burn & Cost Accumulation</h3>
                    </div>
                    <!-- Model Distribution Chart -->
                    <div id="model-chart-container" class="glass-panel p-6 h-80 relative lg:col-span-1">
                        <h3 class="text-sm font-semibold text-zinc-400 uppercase tracking-wider mb-2">Model Distribution</h3>
                    </div>
                </div>

                <!-- Second Row: Orchestrator Loop State & Control -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Left main column: Orchestrator Loop State & Control -->
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Loop Active State details (glorified, premium view) -->
                        <div id="loop-state-card" class="glass-panel p-6">
                            <h3 class="text-sm font-semibold text-zinc-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                                Orchestrator Run State
                            </h3>
                            <div class="space-y-4" id="loop-state-details">
                                <div class="text-center text-zinc-500 py-6 text-sm">Loading active run state...</div>
                            </div>
                        </div>

                        <!-- System control panel (starts/stops loop + HITL overview shortcut) -->
                        <div id="commands-container" class="glass-panel p-6"></div>
                    </div>
                    
                    <!-- Right column: Routing & cognitive details -->
                    <div class="space-y-6">
                        <!-- Routing chain & sota status -->
                        <div id="routing-container" class="glass-panel p-6"></div>
                        <div id="cognitive-container" class="glass-panel p-6"></div>
                    </div>
                </div>

                <!-- Bottom sections: sessions list -->
                <div id="sessions-container" class="glass-panel p-6 h-[400px]"></div>
            </div>

            <!-- 2. LIVE SYSTEM LOGS TAB -->
            <div id="tab-content-logs" class="tab-content">
                <div id="logs-container" class="glass-panel p-6"></div>
            </div>

            <!-- 3. HITL GATE RESOLUTION TAB -->
            <div id="tab-content-hitl" class="tab-content">
                <div id="hitl-panel-container" class="glass-panel p-6 min-h-[300px] flex flex-col justify-between">
                    <div>
                        <h3 class="text-sm font-semibold text-zinc-400 uppercase tracking-wider mb-4">Interactive Human Gate Portal</h3>
                        <div id="hitl-status-area" class="text-center text-zinc-500 py-12">
                            <div class="text-4xl mb-4">🟢</div>
                            <h4 class="text-lg font-medium text-white">System Clear</h4>
                            <p class="text-sm text-zinc-400 mt-2 max-w-md mx-auto">The Loop Orchestrator is running autonomously. No manual authorizations or reviews are currently requested.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. PROVIDER QUOTAS & AUDITS TAB -->
            <div id="tab-content-quotas" class="tab-content space-y-8">
                <div class="glass-panel p-5" id="quota-gauges-container"></div>
                <div class="glass-panel p-6" id="provider-table-container"></div>
            </div>

            <!-- 5. API CALLS EXPLORER TAB -->
            <div id="tab-content-explorer" class="tab-content glass-panel p-6 min-h-[500px]">
                <div id="calls-container" class="h-full"></div>
            </div>

            <!-- 6. MODEL MANAGEMENT TAB -->
            <div id="tab-content-models" class="tab-content">
                <!-- Mounted dynamically -->
            </div>


        </main>
    </div>

    <!-- Application initialization script -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
