router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 60
  fallbacks:
    - "openai/tier-4-planner": ["openai/tier-4-planner-fb1", "openai/tier-4-planner-fb2", "openai/tier-4-planner-fb3", "openai/tier-4-planner-fb4", "openai/tier-4-planner-fb5", "openai/tier-4-planner-fb6"]
    - "openai/tier-3-builder": ["openai/tier-3-builder-fb1", "openai/tier-3-builder-fb2", "openai/tier-3-builder-fb3", "openai/tier-3-builder-fb4", "openai/tier-3-builder-fb5", "openai/tier-3-builder-fb6"]
    - "openai/tier-2-hunter": ["openai/tier-2-hunter-fb1", "openai/tier-2-hunter-fb2", "openai/tier-2-hunter-fb3", "openai/tier-2-hunter-fb4", "openai/tier-2-hunter-fb5"]
    - "openai/tier-1-trivial": ["openai/tier-1-trivial-fb1", "openai/tier-1-trivial-fb2", "openai/tier-1-trivial-fb3", "openai/tier-1-trivial-fb4", "openai/tier-1-trivial-fb5"]
    - "gpt-5-nano": ["gpt-5-nano-fb1", "gpt-5-nano-fb2"]

litellm_settings:
  drop_params: true
  set_verbose: false
  cache: false
