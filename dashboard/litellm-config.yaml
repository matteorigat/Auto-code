      rpm: 20

router_settings:
  routing_strategy: usage-based-routing-v2 # Round-robin with RPM limits
  num_retries: 3           # Retry 3 times across fallback models
  allowed_fails: 2         # Cooldown if a model fails 2 times
  cooldown_time: 60        # Cooldown for 60 seconds
  timeout: 120             # Max seconds per request

litellm_settings:
  custom_callbacks:
    - litellm_logger.proxy_handler_instance

general_settings:
  master_key: sk-litellm-local
