          "openai/tier-1-trivial-fb3",
          "openai/tier-1-trivial-fb4",
        ]
litellm_settings:
  drop_params: true
  set_verbose: true
  cache: false
  request_timeout: 120

general_settings:
  background_health_checks: false
  health_check_interval: 30
  enable_health_check_routing: true
  health_check_ignore_transient_errors: true
