router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 1
  allowed_fails: 1
  cooldown_time: 10
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    TimeoutErrorAllowedFails: 2
    RateLimitErrorAllowedFails: 5
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  fallbacks:
    - gpt-3.5-turbo:
        - gpt-3.5-turbo-fb1
    - gpt-4o-mini:
        - gpt-4o-mini-fb1
    - gpt-4-turbo:
        - gpt-4-turbo-fb1
    - gpt-4o:
        - gpt-4o-fb1
    - openai/tier-4-planner:
        - openai/tier-4-planner-fb2
        - openai/tier-4-planner-fb3
    - openai/tier-3-builder:
        - openai/tier-3-builder-fb2
        - openai/tier-3-builder-fb3
    - openai/tier-2-hunter:
        - openai/tier-2-hunter-fb1
        - openai/tier-2-hunter-fb2
    - openai/tier-1-trivial:
        - openai/tier-1-trivial-fb1
        - openai/tier-1-trivial-fb2
  context_window_fallbacks:
    - gpt-4o:
        - gpt-4o-fb1
    - openai/tier-4-planner:
        - openai/tier-4-planner-fb2
    - openai/tier-3-builder:
        - openai/tier-3-builder-fb2
  rate_limit_fails_allowed: 1
litellm_settings:
  drop_params: true
  set_verbose: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
  request_timeout: 120
  callbacks:
    - dashboard.litellm_logger.proxy_handler_instance
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: false
  health_check_interval: 30
  enable_health_check_routing: true
  health_check_ignore_transient_errors: true
